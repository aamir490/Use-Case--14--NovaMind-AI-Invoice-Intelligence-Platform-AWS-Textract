name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'infrastructure/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  id-token: write   # Required for OIDC token
  contents: read

jobs:
  # ── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/tests/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r backend/tests/requirements-test.txt

      - name: Run unit tests with coverage
        run: |
          pytest backend/tests/unit/ \
            --cov=backend/lambdas \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --tb=short \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── CDK Deploy (only on push to main, not PRs) ────────────────────────────
  deploy:
    name: CDK Deploy (dev)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/package-lock.json

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        run: npm ci
        working-directory: infrastructure

      - name: CDK Synth (validate)
        run: npx cdk synth --context env=dev
        working-directory: infrastructure

      - name: CDK Deploy — Storage + Auth
        run: |
          npx cdk deploy InvoiceStorage-dev InvoiceAuth-dev \
            --context env=dev \
            --require-approval never \
            --outputs-file cdk-outputs.json
        working-directory: infrastructure

      - name: CDK Deploy — Processing + API
        run: |
          npx cdk deploy InvoiceProcessing-dev InvoiceApi-dev \
            --context env=dev \
            --require-approval never \
            --outputs-file cdk-outputs.json
        working-directory: infrastructure

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs
          path: infrastructure/cdk-outputs.json
